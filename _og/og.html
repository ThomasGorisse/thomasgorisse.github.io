<!doctype html>
<!-- Source of /og.png (1200x630). Jekyll does not publish folders starting with "_".
     Re-render: serve the repo root, open /_og/og.html at 1200x630, screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: #0e0d0c; color: #f3f0ec;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 72px 80px;
  }
  .glow {
    position: absolute; right: -40px; top: 70px; width: 560px; height: 520px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(251,146,60,.18), transparent);
  }
  .chair { position: absolute; right: 36px; top: 90px; width: 440px; height: 440px; object-fit: contain; }
  .who { display: flex; align-items: center; gap: 18px; }
  .who img { width: 68px; height: 68px; border-radius: 50%; }
  .name { font-size: 30px; font-weight: 650; letter-spacing: -.01em; }
  .role { font-size: 21px; color: #a79f97; margin-top: 4px; }
  h1 {
    margin-top: 60px; max-width: 620px;
    font-size: 58px; line-height: 1.06; font-weight: 700; letter-spacing: -.035em;
  }
  h1 span { color: #8f877f; }
  .foot {
    position: absolute; left: 80px; right: 80px; bottom: 64px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 21px; color: #a79f97;
  }
  .foot b { color: #fb923c; font-weight: 600; }
  .url { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="chair" src="../assets/sheen-chair.webp" alt="">
  <div class="who">
    <img src="../assets/avatar.webp" alt="">
    <div>
      <div class="name">Thomas Gorisse</div>
      <div class="role">Lead Software Engineer</div>
    </div>
  </div>
  <h1>I build mobile SDKs with AI agents, <span>and the agent systems that build them.</span></h1>
  <div class="foot">
    <div>Creator of <b>SceneView</b> · 3D &amp; AR for Compose, SwiftUI and the web</div>
    <div class="url">thomasgorisse.github.io</div>
  </div>
</body>
</html>
